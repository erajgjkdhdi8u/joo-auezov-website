name: JOO V31 remove duplicated teacher poster names

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v31-teacher-poster-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-poster-duplicates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=10,<13'
      - name: Remove lower repeated name strip without altering teacher portraits
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path('JOO_Auezov_V27_Language_Fixed')
          for name in ('teacher-eldos.webp', 'teacher-balzhan.webp'):
              path = root / 'assets/images/v28' / name
              with Image.open(path) as img:
                  assert img.size in ((1024, 1536), (1024, 1326)), (name, img.size)
                  if img.height == 1326:
                      print('Already cropped:', name)
                      continue
                  # The redundant name band starts at y=1326. Preserve the
                  # entire upper original portrait and typography pixel-for-pixel.
                  cropped = img.crop((0, 0, 1024, 1326))
                  cropped.save(path, 'WEBP', quality=93, method=6)
              with Image.open(path) as check:
                  assert check.size == (1024, 1326)
              print('PASS:', name, '1024x1536 -> 1024x1326')
          for lang in ('', 'ru/', 'en/'):
              path = root / lang / 'team.html'
              source = path.read_text(encoding='utf-8')
              for name in ('teacher-eldos.webp', 'teacher-balzhan.webp'):
                  import re
                  pattern = r'<img\b[^>]*\bsrc="assets/images/v28/' + re.escape(name) + r'"[^>]*>'
                  match = re.search(pattern, source)
                  assert match, (path, name)
                  old = match.group(0)
                  new = re.sub(r'\bheight="\d+"', 'height="1326"', old)
                  source = source.replace(old, new, 1)
              path.write_text(source, encoding='utf-8')
          PY
      - name: Commit corrected posters and dimensions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JOO_Auezov_V27_Language_Fixed/assets/images/v28/teacher-eldos.webp JOO_Auezov_V27_Language_Fixed/assets/images/v28/teacher-balzhan.webp JOO_Auezov_V27_Language_Fixed/team.html JOO_Auezov_V27_Language_Fixed/ru/team.html JOO_Auezov_V27_Language_Fixed/en/team.html
          if ! git diff --cached --quiet; then
            git commit -m "Remove repeated Eldos and Balzhan names embedded at bottom of posters"
            git pull --rebase origin main
            git push
          fi
