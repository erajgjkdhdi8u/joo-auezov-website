name: Apply JOO V28 photo update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'JOO_V28_11_Photos_For_GitHub.zip'
      - 'JOO_Auezov_V27_Language_Fixed/assets/images/v28/*.webp'

permissions:
  contents: write

jobs:
  apply-v28:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract uploaded ZIP when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f JOO_V28_11_Photos_For_GitHub.zip ]; then
            mkdir -p JOO_Auezov_V27_Language_Fixed/assets/images/v28
            unzip -o -j JOO_V28_11_Photos_For_GitHub.zip '*.webp' -d JOO_Auezov_V27_Language_Fixed/assets/images/v28/
          fi
      - name: Check all eleven images are present
        shell: bash
        run: |
          set -euo pipefail
          d=JOO_Auezov_V27_Language_Fixed/assets/images/v28
          for name in school-building school-classroom school-students school-reception school-gym school-corridor school-lounge school-cafeteria teacher-magzhan teacher-eldos teacher-balzhan; do
            test -s "$d/$name.webp" || { echo "::error::Missing $d/$name.webp"; exit 1; }
          done
      - name: Preview V28 changes
        run: |
          cd JOO_Auezov_V27_Language_Fixed
          python tools/apply_v28_photos.py --dry-run
      - name: Apply V28 changes
        run: |
          cd JOO_Auezov_V27_Language_Fixed
          python tools/apply_v28_photos.py
      - name: Confirm Mereke profile is absent
        shell: bash
        run: |
          if grep -Ei 'Мереке Ұстаз|mereke-ustaz' JOO_Auezov_V27_Language_Fixed/career.html; then
            echo "::error::Mereke profile must remain removed"
            exit 1
          fi
      - name: Commit updated HTML and image assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'JOO_Auezov_V27_Language_Fixed/*.html' 'JOO_Auezov_V27_Language_Fixed/assets/images/v28/*.webp'
          if ! git diff --cached --quiet; then
            git commit -m "Apply V28 school photos and teacher portraits"
            git push
          fi
