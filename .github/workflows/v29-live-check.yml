name: JOO V29 live Netlify verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v29-live-check.yml'
      - 'JOO_Auezov_V27_Language_Fixed/ru/index.html'
      - 'JOO_Auezov_V27_Language_Fixed/en/index.html'

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install image dimension checker
        run: python -m pip install 'Pillow>=10,<13'
      - name: Check live Netlify pages without sending user data
        shell: bash
        run: |
          python - <<'PY'
          import time
          from urllib.request import Request, urlopen
          urls = {
            'home': 'https://joo-auezov.netlify.app/',
            'admissions': 'https://joo-auezov.netlify.app/admissions.html',
            'ru': 'https://joo-auezov.netlify.app/ru/index.html',
            'en': 'https://joo-auezov.netlify.app/en/index.html',
            'sitemap': 'https://joo-auezov.netlify.app/sitemap.xml',
            'career-webp': 'https://joo-auezov.netlify.app/assets/images/career/dias-asanov-poster.webp',
            'v30-campus': 'https://joo-auezov.netlify.app/campus.html',
            'v30-academics': 'https://joo-auezov.netlify.app/academics.html',
            'v30-style': 'https://joo-auezov.netlify.app/style.css',
            'v30-portraits': 'https://joo-auezov.netlify.app/joo-six-effects.css',
            'ru-resources': 'https://joo-auezov.netlify.app/ru/resources.html',
            'en-resources': 'https://joo-auezov.netlify.app/en/resources.html',
            'v33-css': 'https://joo-auezov.netlify.app/v33-cinematic.css',
            'v33-script': 'https://joo-auezov.netlify.app/v33-cinematic.js',
            'v33-ru-campus': 'https://joo-auezov.netlify.app/ru/campus.html',
            'v33-en-results': 'https://joo-auezov.netlify.app/en/results.html',
            'v33-kk-team': 'https://joo-auezov.netlify.app/team.html',
          }
          failures = []
          for label, url in urls.items():
              success = False
              for attempt in range(5):
                  try:
                      with urlopen(Request(url, headers={'User-Agent': 'JOO-V29-Live-Check/1.0'}), timeout=20) as response:
                          data = response.read(500000).decode('utf-8', 'replace')
                          status = response.status
                      marker = {
                        'home': 'Created by',
                        'admissions': 'data-netlify="true"',
                        'ru': 'lang="ru"',
                        'en': 'lang="en"',
                        'sitemap': '<urlset',
                        'career-webp': '',
                        'v30-campus': 'assets/images/exterior-480.webp',
                        'v30-academics': 'assets/images/v28/school-cafeteria.webp',
                        'v30-style': 'V30 WebKit 320px',
                        'v30-portraits': 'V32: Teacher names stay visibly readable',
                        'ru-resources': 'На странице не приводятся',
                        'en-resources': 'This page avoids',
                        'v33-css': 'JOO V33 CINEMATIC EDITION',
                        'v33-script': 'JOO V33 Cinematic Edition',
                        'v33-ru-campus': '05 / JOO AUEZOV',
                        'v33-en-results': 'v33-cinematic.js',
                        'v33-kk-team': 'v33-cinematic.css',
                      }[label]
                      success = status == 200 and (marker in data if marker else True)
                      print(label, 'HTTP', status, 'marker', marker, 'found', success)
                      if success: break
                  except Exception as exc:
                      print(label, 'attempt', attempt+1, type(exc).__name__, str(exc)[:160])
                  time.sleep(10)
              if not success: failures.append(label)
          if failures:
              print('LIVE NOT VERIFIED:', failures)
              raise SystemExit(1)
          from io import BytesIO
          from PIL import Image
          for person in ('eldos', 'balzhan'):
              url = 'https://joo-auezov.netlify.app/assets/images/v28/teacher-' + person + '.webp'
              verified = False
              for attempt in range(6):
                  with urlopen(Request(url, headers={'User-Agent':'JOO-V31-Poster-Audit/1.0'}), timeout=20) as response:
                      payload = response.read()
                  with Image.open(BytesIO(payload)) as img:
                      size = img.size
                  print('v31 poster', person, size, 'attempt', attempt + 1)
                  if size == (1024, 1326):
                      verified = True
                      break
                  time.sleep(12)
              if not verified:
                  raise SystemExit('Live V31 poster not yet updated: ' + person)
          print('PASS: live Netlify pages and two V31 teacher posters')

          PY
